<div class="band-image-modal" role="dialog" aria-modal="true" aria-labelledby="band-image-title" (keydown.escape)="cancel()">
  <div class="band-image-modal__backdrop"></div><section class="band-image-modal__panel">
    <header><div><span class="band-image-modal__eyebrow">Band media</span><h2 id="band-image-title">{{ title }}</h2></div><button type="button" class="band-image-modal__close" (click)="cancel()" [disabled]="saving()" aria-label="Close image editor"><span aria-hidden="true"></span></button></header>
    <div class="band-image-modal__drop" [class.band-image-modal__drop--active]="previewUrl()" (drop)="onDrop($event)" (dragover)="onDragOver($event)">
      @if (previewUrl()) { <img [src]="previewUrl()!" alt="Selected image preview" /> } @else if (currentImageUrl()) { <img [src]="currentImageUrl()!" alt="Current band image" /> } @else { <span class="band-image-modal__drop-icon" aria-hidden="true">↑</span><strong>Drop an image here</strong><span>PNG, JPG or JPEG · up to 5 MB</span> }
      <label class="band-image-modal__choose"><input type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" (change)="selectFile($event)" />Choose image</label>
    </div>
    @if (file()) { <p>{{ file()!.name }} · {{ (file()!.size / 1024 / 1024).toFixed(2) }} MB</p> }
    @if (error()) { <p class="band-image-modal__error" role="alert">{{ error() }}</p> }
    <footer><button type="button" (click)="cancel()" [disabled]="saving()">Cancel</button><button type="button" (click)="submit()" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save image' }}</button></footer>
  </section>
</div>
