<div class="release-delete-confirmation" role="dialog" aria-modal="true" aria-labelledby="delete-release-title">
  <div class="release-delete-confirmation__backdrop" aria-hidden="true"></div>
  <section class="release-delete-confirmation__panel">
    <h2 id="delete-release-title" class="release-delete-confirmation__title">Delete release?</h2>
    <p class="release-delete-confirmation__message">Remove <strong>{{ release().title }}</strong> and all of its tracks? This action cannot be undone.</p>
    @if (error(); as message) { <p class="release-delete-confirmation__error" role="alert">{{ message }}</p> }
    <footer class="release-delete-confirmation__actions">
      <button type="button" class="release-delete-confirmation__cancel" (click)="close.emit()" [disabled]="deleting()">Cancel</button>
      <button type="button" class="release-delete-confirmation__delete" data-testid="confirm-delete-release" (click)="confirm.emit()" [disabled]="deleting()">{{ deleting() ? 'Deleting…' : 'Delete release' }}</button>
    </footer>
  </section>
</div>
