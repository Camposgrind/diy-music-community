<div class="band-detail container">
  <dmc-back-to-results />

  @if (loading()) {
    <div class="band-detail__loading">
      <img src="images/Play GIF Image.png" alt="Loading..." class="band-detail__loading-gif" />
      <p>Loading band details...</p>
    </div>
  } @else if (error()) {
    <div class="band-detail__error">
      <p class="band-detail__error-msg">{{ error() }}</p>
      <div class="band-detail__error-actions">
        <button class="band-detail__action-btn band-detail__action-btn--primary" (click)="retry()">
          Try Again
        </button>
        <a class="band-detail__action-btn" routerLink="/">Browse Bands</a>
      </div>
    </div>
  } @else if (band(); as b) {
    <dmc-band-hero [band]="b" [isAdmin]="isAdmin()" (edit)="openEditModal()" />

    <dmc-band-discography
      [releases]="b.releases"
      [bandId]="b.id"
      [isAdmin]="isAdmin()"
      (addRelease)="openCreateReleaseModal()"
      (editRelease)="openEditReleaseModal($event)" />

    <dmc-band-members [members]="isSplitUp() ? lastKnownMembers() : currentMembers()" [title]="isSplitUp() ? 'Last Known Lineup' : 'Current Members'" [memberType]="isSplitUp() ? 'lastKnown' : 'current'" [isAdmin]="isAdmin()" (addMember)="openCreateMemberModal($event)" (editMember)="openEditMemberModal($event)" (deleteMember)="openDeleteMemberModal($event)" />
    <dmc-band-members [members]="pastMembers()" title="Past Members" memberType="past" [isAdmin]="isAdmin()" (addMember)="openCreateMemberModal($event)" (editMember)="openEditMemberModal($event)" (deleteMember)="openDeleteMemberModal($event)" />
  }
</div>

@if (isEditModalOpen() && editData(); as data) {
  <dmc-band-edit-modal
    [countries]="countries()"
    [genres]="genres()"
    [initialData]="data"
    [saving]="isUpdatingBand()"
    [error]="editError()"
    (save)="saveBand($event)"
    (close)="closeEditModal()" />
}

@if (releaseModalMode(); as mode) {
  <dmc-release-modal
    [mode]="mode"
    [initialData]="releaseModalData()"
    [saving]="isSavingRelease()"
    [error]="releaseError()"
    (save)="saveRelease($event)"
    (close)="closeReleaseModal()" />
}

@if (memberModalMode(); as mode) {
  <dmc-member-modal
    [mode]="mode"
    [memberType]="memberModalType()"
    [isSplitUp]="isSplitUp()"
    [initialData]="memberModalData()"
    [saving]="isSavingMember()"
    [error]="memberError()"
    (save)="saveMember($event)"
    (close)="closeMemberModal()" />
}

@if (deletingMember(); as member) {
  <dmc-member-delete-confirmation
    [member]="member"
    [deleting]="isDeletingMember()"
    [error]="deleteMemberError()"
    (confirm)="confirmDeleteMember()"
    (close)="closeDeleteMemberModal()" />
}
