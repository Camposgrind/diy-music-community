<div class="member-delete-confirmation" role="dialog" aria-modal="true" aria-labelledby="delete-member-title">
  <div class="member-delete-confirmation__backdrop" aria-hidden="true"></div>
  <section class="member-delete-confirmation__panel">
    <h2 id="delete-member-title" class="member-delete-confirmation__title">Delete member?</h2>
    <p class="member-delete-confirmation__message">Remove <strong>{{ member().name }}</strong> from this band? This action cannot be undone.</p>
    @if (error(); as message) {
      <p class="member-delete-confirmation__error" role="alert">{{ message }}</p>
    }
    <footer class="member-delete-confirmation__actions">
      <button type="button" class="member-delete-confirmation__cancel" (click)="close.emit()" [disabled]="deleting()">Cancel</button>
      <button type="button" class="member-delete-confirmation__delete" data-testid="confirm-delete-member" (click)="confirm.emit()" [disabled]="deleting()">{{ deleting() ? 'Deleting…' : 'Delete member' }}</button>
    </footer>
  </section>
</div>
