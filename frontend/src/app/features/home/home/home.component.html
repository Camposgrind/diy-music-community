<section class="hero">
  <div class="hero__inner container">
    <h1 class="hero__title">Discover the Underground</h1>
    <p class="hero__subtitle">Community Driven Underground Music Database</p>
  </div>
</section>

<section class="search-section container">
  @if (isAdmin()) {
    <div class="search-section__admin-action">
      <button type="button" class="search-section__add-band" (click)="openCreateModal()">+ Add Band</button>
    </div>
  }
  <dmc-bands-search-form
    [countries]="countries()"
    [genres]="genres()"
    [genresError]="genresError()"
    [initialFilters]="savedFilters()"
    (search)="onSearch($event)"
    (reset)="onReset()" />
</section>

@if (isCreateModalOpen()) {
  <dmc-band-create-modal
    [countries]="countries()"
    [genres]="genres()"
    [saving]="isCreatingBand()"
    [error]="createBandError()"
    (save)="createBand($event)"
    (close)="closeCreateModal()" />
}

<section class="results-section container">
  <dmc-bands-results
    [results]="results()"
    [loading]="loading()"
    [error]="error()"
    (pageChange)="onPageChange($event)" />
</section>

@if (toastMessage(); as msg) {
  <div class="toast-container">
    <div class="toast toast--error" (click)="dismissToast()">
      {{ msg }}
    </div>
  </div>
}
