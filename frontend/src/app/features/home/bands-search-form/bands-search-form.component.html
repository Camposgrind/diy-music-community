<div class="search-form">
  <h2 class="search-form__title">Search Bands</h2>
  <form [formGroup]="form" (ngSubmit)="onSearch()" class="search-form__fields">
    <div class="search-form__field">
      <label class="search-form__label" for="bandName">Band Name</label>
      <input
        id="bandName"
        type="text"
        formControlName="name"
        placeholder="e.g. Discharge, Napalm Death..."
        autocomplete="off" />
    </div>
    <div class="search-form__field">
      <label class="search-form__label" for="country">Country</label>
      <select id="country" formControlName="country">
        <option value="">All Countries</option>
        @for (c of countries(); track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>
    <div class="search-form__field">
      <label class="search-form__label" for="genre">Genre</label>
      @if (genresError()) {
        <p class="search-form__field-error">{{ genresError() }}</p>
      } @else {
        <select id="genre" formControlName="genreId">
          <option value="">All Genres</option>
          @for (g of genres(); track g.id) {
            <option [value]="g.id">{{ g.name }}</option>
          }
        </select>
      }
    </div>
    <div class="search-form__actions">
      <button type="submit" class="search-form__btn search-form__btn--search">Search</button>
      <button type="button" class="search-form__btn search-form__btn--reset" (click)="onReset()">Reset</button>
    </div>
  </form>
</div>
