<div class="track-list-delete-confirmation" role="dialog" aria-modal="true" aria-labelledby="delete-track-list-title">
  <div class="track-list-delete-confirmation__backdrop" aria-hidden="true"></div>
  <section class="track-list-delete-confirmation__panel">
    <h2 id="delete-track-list-title" class="track-list-delete-confirmation__title">Delete all tracks?</h2>
    <p class="track-list-delete-confirmation__message">Remove every track from <strong>{{ releaseTitle() }}</strong>? The release will remain, but this action cannot be undone.</p>
    @if (error(); as message) { <p class="track-list-delete-confirmation__error" role="alert">{{ message }}</p> }
    <footer class="track-list-delete-confirmation__actions">
      <button type="button" class="track-list-delete-confirmation__cancel" (click)="close.emit()" [disabled]="deleting()">Cancel</button>
      <button type="button" class="track-list-delete-confirmation__delete" data-testid="confirm-delete-all-tracks" (click)="confirm.emit()" [disabled]="deleting()">{{ deleting() ? 'Deleting…' : 'Delete all tracks' }}</button>
    </footer>
  </section>
</div>
